<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 350" width="100%" height="100%">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&amp;family=Fira+Code:wght@400;700&amp;display=swap');

        .bg {
            fill: #040308;
            stroke: #2a1b4e;
            stroke-width: 2;
        }

        /* Scanline simulation */
        .scanline {
            fill: url(#scanline-grad);
            opacity: 0.1;
            animation: scan 6s linear infinite;
        }

        /* Typography */
        .header-title {
            font-family: 'Outfit', sans-serif;
            font-size: 11px;
            font-weight: 700;
            fill: #a5b4fc;
            letter-spacing: 0.2em;
        }

        .hud-title {
            font-family: 'Outfit', sans-serif;
            font-size: 38px;
            font-weight: 900;
            fill: #ffffff;
            letter-spacing: -0.02em;
        }

        .hud-subtitle {
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            font-weight: 700;
            fill: #06b6d4;
        }

        .code-text {
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            fill: #94a3b8;
        }

        .code-accent {
            fill: #ec4899;
            font-weight: 700;
        }

        .code-cyan {
            fill: #06b6d4;
            font-weight: 700;
        }

        .code-green {
            fill: #10b981;
        }

        /* Holo Ring Animations */
        .holo-ring {
            transform-origin: 150px 175px;
            fill: none;
            stroke-width: 1.5;
        }

        .ring-outer {
            stroke: #6366f1;
            stroke-dasharray: 20 10 40 15;
            animation: rotate-clockwise 18s linear infinite;
        }

        .ring-inner {
            stroke: #ec4899;
            stroke-dasharray: 10 20 30 10;
            animation: rotate-counter 12s linear infinite;
        }

        .ring-core {
            stroke: #06b6d4;
            stroke-dasharray: 5 5;
            animation: rotate-clockwise 6s linear infinite;
        }

        .core-glow {
            fill: #06b6d4;
            opacity: 0.15;
            filter: blur(10px);
            animation: pulse-glow 2s infinite alternate ease-in-out;
        }

        /* Status Blinky */
        .status-dot {
            fill: #10b981;
            animation: blink 1.2s infinite;
        }

        /* Glitch Animation */
        .glitch-text {
            animation: glitch 4s infinite;
        }

        @keyframes scan {
            0% { y: -50px; }
            100% { y: 350px; }
        }

        @keyframes rotate-clockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes rotate-counter {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes pulse-glow {
            0% { r: 15; opacity: 0.1; }
            100% { r: 35; opacity: 0.3; }
        }

        @keyframes blink {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; filter: drop-shadow(0 0 4px #10b981); }
        }

        @keyframes glitch {
            0%, 95%, 100% { transform: translate(0); text-shadow: none; }
            96% { transform: translate(-2px, 1px); text-shadow: -2px 0 #ec4899, 2px 0 #06b6d4; }
            97% { transform: translate(2px, -1px); text-shadow: -2px 0 #06b6d4, 2px 0 #ec4899; }
            98% { transform: translate(-1px, -2px); text-shadow: -1px 0 #ec4899, 1px 0 #06b6d4; }
            99% { transform: translate(1px, 2px); text-shadow: none; }
        }

        /* Grid Background Pattern */
        .cyber-grid {
            fill: url(#grid-pattern);
            opacity: 0.15;
        }
    </style>

    <defs>
        <!-- Scanner Gradient -->
        <linearGradient id="scanline-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ec4899" stop-opacity="0" />
            <stop offset="50%" stop-color="#ec4899" stop-opacity="1" />
            <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
        </linearGradient>

        <!-- Cyber Grid Pattern -->
        <pattern id="grid-pattern" width="25" height="25" patternUnits="userSpaceOnUse">
            <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#6366f1" stroke-width="0.5" />
        </pattern>
        
        <!-- Glow filters -->
        <filter id="glow-neon" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Base Canvas -->
    <rect width="828" height="348" x="1" y="1" class="bg" rx="10" />
    <rect width="828" height="348" x="1" y="1" class="cyber-grid" rx="10" />

    <!-- Scanning Laser -->
    <rect width="828" height="30" x="1" class="scanline" />

    <!-- HUD Frame / Window Top Bar -->
    <path d="M 1,35 L 829,35" stroke="#2a1b4e" stroke-width="1.5" />
    
    <!-- Console Controls -->
    <circle cx="18" cy="18" r="4.5" fill="#ef4444" />
    <circle cx="32" cy="18" r="4.5" fill="#eab308" />
    <circle cx="46" cy="18" r="4.5" fill="#22c55e" />
    <text x="70" y="21" class="header-title">PREETI_OS // SYSTEM_BOOT: OK</text>

    <!-- Network Link Indicators -->
    <g transform="translate(680, 10)">
        <rect width="130" height="16" rx="4" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.05)" />
        <circle cx="12" cy="8" r="4.5" class="status-dot" />
        <text x="24" y="12" font-family="'Fira Code', monospace" font-size="9" fill="#10b981" font-weight="bold">SLAY_SERVER: ONLINE</text>
    </g>

    <!-- ================= LEFT: 3D HOLO ORB ================= -->
    <g transform="translate(0, 0)">
        <!-- Core pulsating glow -->
        <circle cx="150" cy="175" r="25" class="core-glow" />
        <circle cx="150" cy="175" r="8" fill="#06b6d4" />
        
        <!-- Rotating rings -->
        <circle cx="150" cy="175" r="95" class="holo-ring ring-outer" />
        <circle cx="150" cy="175" r="70" class="holo-ring ring-inner" />
        <circle cx="150" cy="175" r="45" class="holo-ring ring-core" />

        <!-- Crosshair ticks -->
        <path d="M 150,55 L 150,65 M 150,285 L 150,295 M 30,175 L 40,175 M 260,175 L 270,175" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
        
        <!-- Angle ticks -->
        <text x="142" y="50" font-family="'Fira Code', monospace" font-size="7" fill="rgba(255, 255, 255, 0.2)">000°</text>
        <text x="142" y="309" font-family="'Fira Code', monospace" font-size="7" fill="rgba(255, 255, 255, 0.2)">180°</text>
    </g>

    <!-- ================= RIGHT: CONSOLE TERMINAL ================= -->
    <g transform="translate(290, 60)">
        <!-- Screen Backdrop -->
        <rect width="510" height="255" rx="8" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(99, 102, 241, 0.1)" stroke-width="1.5" />
        
        <!-- Terminal Prompts -->
        <text x="25" y="40" class="hud-title glitch-text">PREETI MAURYA</text>
        <text x="25" y="65" class="hud-subtitle">> CORE_SYS_INITIALIZED // TECHIE_BADDIE_MODE</text>
        
        <g transform="translate(25, 95)">
            <text x="0" y="0" class="code-text"><tspan class="code-accent">$</tspan> preeti --status</text>
            <text x="20" y="20" class="code-text"><tspan class="code-cyan">Class:</tspan> Full-Stack Dev &amp; Data Scientist</text>
            <text x="20" y="40" class="code-text"><tspan class="code-cyan">Base:</tspan> IIT Madras (Data Science) &amp; REC Sonbhadra</text>
            <text x="20" y="60" class="code-text"><tspan class="code-cyan">Current:</tspan> Interning @ Sudha Gopalakrishnan Brain Centre</text>
            
            <text x="0" y="95" class="code-text"><tspan class="code-accent">$</tspan> preeti --vibe</text>
            <text x="20" y="115" class="code-text"><tspan class="code-cyan">Metrics:</tspan> Slay-Coefficient: <tspan class="code-green">MAXIMUM_OVERFLOW</tspan></text>
            <text x="20" y="135" class="code-text"><tspan class="code-cyan">Motto:</tspan> "Code beautifully. Deploy cleanly. Slay daily."</text>
        </g>
        
        <!-- Blinking cursor -->
        <rect x="495" y="222" width="8" height="15" fill="#ec4899" class="status-dot" />
    </g>

    <!-- Tech HUD Grid accents -->
    <path d="M 12,336 L 250,336 L 260,326" fill="none" stroke="rgba(99, 102, 241, 0.2)" stroke-width="1.5" />
    <path d="M 816,45 L 816,100 L 806,110" fill="none" stroke="rgba(236, 72, 153, 0.2)" stroke-width="1.5" />
</svg>
